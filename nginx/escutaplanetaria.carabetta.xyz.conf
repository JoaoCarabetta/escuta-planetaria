# Escuta Planetária — path staging under one vhost
# /        → /var/www/escutaplanetaria/prod   (branch prod)
# /joao/   → /var/www/escutaplanetaria/joao   (branch joao)
# /filipe/ → /var/www/escutaplanetaria/filipe (branch filipe)
#
# Asset paths in the app are relative (no absolute "/" href/src), so path
# staging works. After installing, run:
#   certbot --nginx -d escutaplanetaria.carabetta.xyz --redirect

server {
    listen 80;
    listen [::]:80;
    server_name escutaplanetaria.carabetta.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /joao { return 301 /joao/; }
    location = /filipe { return 301 /filipe/; }

    location ^~ /joao/ {
        root /var/www/escutaplanetaria;
        index index.html;
        charset utf-8;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }

    location ^~ /filipe/ {
        root /var/www/escutaplanetaria;
        index index.html;
        charset utf-8;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }

    location / {
        root /var/www/escutaplanetaria/prod;
        index index.html;
        charset utf-8;
        gzip on;
        gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/escutaplanetaria-access.log;
    error_log  /var/log/nginx/escutaplanetaria-error.log;
}
